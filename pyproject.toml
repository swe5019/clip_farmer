[project]
name = "clip_farmer"
version = "0.1.0"
description = "Automated pipeline that clips podcasts/YouTube videos and posts them to social media"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.0",
    "anthropic>=0.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.4",
    "opencv-python-headless>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
include = ["clip_farmer*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
